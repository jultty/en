on:
  push:
    branches:
      - '*'
    paths:
      - src/**
      - tests/**
      - static/graph.toml
      - .forgejo/**
      - Cargo.toml
      - Cargo.lock
jobs:
  verify:
    runs-on: docker
    timeout-minutes: 20
    container:
      image: rust:slim
    steps:
      - name: Install action dependencies
        run: apt-get install --no-install-recommends --update -y nodejs curl

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Setup Rust toolchain
        run: |
          rustup component add llvm-tools-preview
          rustup component add --toolchain nightly rustfmt clippy

      - name: Setup additional tooling
        run: .forgejo/workflows/setup-tools.sh

      - name: Build
        run: just build

      - name: Format
        run: just format-assess
      - name: Lint
        run: just lint-assess
      - name: Cargo check
        run: just check
      - name: Test
        run: just test
      - name: Assess test coverage
        run: just cover-assess

