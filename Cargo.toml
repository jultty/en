[package.metadata.typos.default]
extend-ignore-re = [
    "oficial do Brasil",
    "Creative Commons ND",
    "Creative Commons BY-ND",
    "CC_BY_ND_",
    "(?ms)^mod tests \\{.*^\\}",
]
